<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" role="img" aria-labelledby="t d">
  <title id="t">Encadeamento dos blocos</title>
  <desc id="d">Três blocos: a gênese, com prev zerado, e os blocos 1 e 2. O campo prev de cada bloco guarda a assinatura (sig) do bloco anterior. A assinatura cobre o bloco inteiro com sig zerado.</desc>
  <style>
    .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
    .hdr { fill: #dafbe1; stroke: #8c959f; stroke-width: 1.2; }
    .sigrow { fill: #fff8c5; stroke: #8c959f; stroke-width: 1.2; }
    .sep { stroke: #d0d7de; stroke-width: 1; }
    .t { fill: #1f2328; font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .k { fill: #57606a; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .v { fill: #1f2328; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .note { fill: #57606a; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .link { stroke: #1a7f37; stroke-width: 2; fill: none; }
    .head { fill: #1a7f37; }
    .cover { stroke: #8250df; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    .covertxt { fill: #8250df; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .hdr { fill: #12261e; stroke: #6e7681; }
      .sigrow { fill: #2e2a12; stroke: #6e7681; }
      .sep { stroke: #30363d; }
      .t, .v { fill: #e6edf3; }
      .k, .note { fill: #8d96a0; }
      .link { stroke: #3fb950; }
      .head { fill: #3fb950; }
      .cover { stroke: #a371f7; }
      .covertxt { fill: #a371f7; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- Bloco: cabeçalho (30), prev, author, data (30 cada), sig (30) -->
  <g id="b0" transform="translate(20 30)">
    <rect class="box" x="0" y="0" width="200" height="150" rx="8"/>
    <rect class="hdr" x="0" y="0" width="200" height="30" rx="8"/>
    <rect class="hdr" x="0" y="20" width="200" height="10" style="stroke:none"/>
    <text class="t" x="100" y="20" text-anchor="middle">gênese</text>
    <line class="sep" x1="0" y1="60" x2="200" y2="60"/>
    <line class="sep" x1="0" y1="90" x2="200" y2="90"/>
    <text class="k" x="12" y="50">prev</text><text class="v" x="188" y="50" text-anchor="end">0…0</text>
    <text class="k" x="12" y="80">author</text><text class="v" x="188" y="80" text-anchor="end">chave A</text>
    <text class="k" x="12" y="110">data</text><text class="v" x="188" y="110" text-anchor="end">"oi"</text>
    <rect class="sigrow" x="0" y="120" width="200" height="30" rx="8"/>
    <rect class="sigrow" x="0" y="120" width="200" height="10" style="stroke:none"/>
    <text class="k" x="12" y="140">sig</text><text class="v" x="188" y="140" text-anchor="end">S0</text>
  </g>

  <g id="b1" transform="translate(290 30)">
    <rect class="box" x="0" y="0" width="200" height="150" rx="8"/>
    <rect class="hdr" x="0" y="0" width="200" height="30" rx="8"/>
    <rect class="hdr" x="0" y="20" width="200" height="10" style="stroke:none"/>
    <text class="t" x="100" y="20" text-anchor="middle">bloco 1</text>
    <line class="sep" x1="0" y1="60" x2="200" y2="60"/>
    <line class="sep" x1="0" y1="90" x2="200" y2="90"/>
    <text class="k" x="12" y="50">prev</text><text class="v" x="188" y="50" text-anchor="end">S0</text>
    <text class="k" x="12" y="80">author</text><text class="v" x="188" y="80" text-anchor="end">chave B</text>
    <text class="k" x="12" y="110">data</text><text class="v" x="188" y="110" text-anchor="end">"olá"</text>
    <rect class="sigrow" x="0" y="120" width="200" height="30" rx="8"/>
    <rect class="sigrow" x="0" y="120" width="200" height="10" style="stroke:none"/>
    <text class="k" x="12" y="140">sig</text><text class="v" x="188" y="140" text-anchor="end">S1</text>
  </g>

  <g id="b2" transform="translate(560 30)">
    <rect class="box" x="0" y="0" width="200" height="150" rx="8"/>
    <rect class="hdr" x="0" y="0" width="200" height="30" rx="8"/>
    <rect class="hdr" x="0" y="20" width="200" height="10" style="stroke:none"/>
    <text class="t" x="100" y="20" text-anchor="middle">bloco 2</text>
    <line class="sep" x1="0" y1="60" x2="200" y2="60"/>
    <line class="sep" x1="0" y1="90" x2="200" y2="90"/>
    <text class="k" x="12" y="50">prev</text><text class="v" x="188" y="50" text-anchor="end">S1</text>
    <text class="k" x="12" y="80">author</text><text class="v" x="188" y="80" text-anchor="end">chave A</text>
    <text class="k" x="12" y="110">data</text><text class="v" x="188" y="110" text-anchor="end">"tudo bem?"</text>
    <rect class="sigrow" x="0" y="120" width="200" height="30" rx="8"/>
    <rect class="sigrow" x="0" y="120" width="200" height="10" style="stroke:none"/>
    <text class="k" x="12" y="140">sig</text><text class="v" x="188" y="140" text-anchor="end">S2</text>
  </g>

  <!-- Elos: sig de um bloco → prev do seguinte. A linha para na base da seta (16 px antes do bloco: 10 unidades do
       marker × markerWidth 8/10 × stroke 2), para a ponta do triângulo ficar limpa -->
  <path class="link" d="M220 165 C 250 165, 245 75, 273 75" marker-end="url(#arrow)"/>
  <path class="link" d="M490 165 C 520 165, 515 75, 543 75" marker-end="url(#arrow)"/>

  <!-- Área coberta pela assinatura, mostrada no bloco 2 -->
  <rect class="cover" x="555" y="25" width="210" height="160" rx="10"/>
  <text class="covertxt" x="660" y="200" text-anchor="middle">assinado com a chave A (com sig zerado)</text>

  <text class="note" x="20" y="240">Cada bloco guarda em prev a assinatura do bloco anterior. A assinatura cobre o bloco inteiro,</text>
  <text class="note" x="20" y="260">inclusive o prev; alterar um bloco antigo invalida a assinatura dele e quebra o elo com o seguinte.</text>
  <text class="note" x="20" y="280">Campos omitidos no desenho: room, stamp, nonce, info, type e length (ver a tabela acima).</text>
</svg>
