# Ponto de acesso Wi-Fi do Bizas: a placa é a rede, sem internet, para os aparelhos próximos abrirem a página. Quem
# inicia: /etc/init.d/S39wifi-ap. O pacote hostapd instala um hostapd.conf de exemplo em /etc; o overlay é copiado
# depois dos pacotes, então é este que fica na imagem

interface=wlan0
driver=nl80211

ssid=BizasChat
hw_mode=g
channel=6

# Só WPA2-PSK. auth_algs=1 é "Open System": sem ele o hostapd também aceitaria WEP Shared Key
auth_algs=1
wpa=2
wpa_passphrase=embarcados2026
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP

# Para o hostapd_cli no console: "hostapd_cli all_sta" lista os aparelhos associados
ctrl_interface=/var/run/hostapd

# Sem country_code, de propósito: o brcmfmac segue o domínio regulatório do próprio firmware (CLM), e um country_code
# que o driver recuse faz o hostapd abortar. O canal 6 de 2,4 GHz é permitido em qualquer domínio. O regulatory.db
# está na imagem, então "country_code=BR" e "ieee80211d=1" podem ser acrescentados sem recompilar
