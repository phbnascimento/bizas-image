# DHCP da rede Wi-Fi do Bizas. Quem inicia: /etc/init.d/S39wifi-ap, depois do hostapd. O S80dnsmasq que o pacote
# instala é removido pelo post-build.sh, para o dnsmasq não subir duas vezes

# Só DHCP: sem DNS (port=0), porque a rede não tem internet e a página se abre pelo IP
port=0

interface=wlan0
# bind-dynamic acompanha a wlan0 aparecendo ou trocando de endereço; o bind-interfaces exigiria que ela já existisse,
# com endereço, no instante em que o dnsmasq sobe
bind-dynamic

dhcp-range=192.168.50.10,192.168.50.100,255.255.255.0,12h
# Único servidor DHCP da rede: responde logo a quem pede um endereço antigo de outra rede
dhcp-authoritative

# Cada oferta e concessão vai para o syslog (/var/log/messages): mostra o endereço que o aparelho recebeu
log-dhcp
